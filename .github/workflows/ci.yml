# NOTE: written but not yet executed on GitHub Actions (the suite itself passes locally).
name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: recon_user, POSTGRES_PASSWORD: recon_pass, POSTGRES_DB: recon_platform}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U recon_user" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements-dev.txt
      - run: pytest --cov=recon
      - run: pytest
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://recon_user:recon_pass@localhost:5432/recon_platform
